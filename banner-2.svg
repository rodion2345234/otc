<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 420" width="1170" height="420">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12994A"/><stop offset=".55" stop-color="#22C55E"/><stop offset="1" stop-color="#4ADE80"/></linearGradient>
<radialGradient id="glow" cx=".82" cy=".46" r=".5"><stop offset="0" stop-color="#E7FFF0" stop-opacity=".75"/><stop offset="1" stop-color="#E7FFF0" stop-opacity="0"/></radialGradient>
<linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE06B"/><stop offset="1" stop-color="#F5A623"/></linearGradient>
<linearGradient id="sh1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFF4D3"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#064524" flood-opacity=".4"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
<path id="s5" d="M0,-1 L.2245,-.309 L.9511,-.309 L.3633,.118 L.5878,.809 L0,.382 L-.5878,.809 L-.3633,.118 L-.9511,-.309 L-.2245,-.309Z"/>
<path id="s4" d="M0,-1 Q.12,-.12 1,0 Q.12,.12 0,1 Q-.12,.12 -1,0 Q-.12,-.12 0,-1Z"/>
<style>
.tw{animation:tw 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
.tw2{animation-delay:.8s}.tw3{animation-delay:1.6s}.tw4{animation-delay:.4s}
@keyframes tw{0%,100%{opacity:.35; transform:scale(.6) rotate(0)}50%{opacity:1; transform:scale(1.15) rotate(45deg)}}
.flare{animation:flare 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes flare{0%,100%{opacity:.6; transform:scale(.8) rotate(0)}50%{opacity:1; transform:scale(1.25) rotate(90deg)}}
.pill{animation:pill 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes pill{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.big{animation:big 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes big{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(6deg) scale(1.04)}}
.pct{animation:pct 3s ease-in-out infinite; transform-box:fill-box; transform-origin:left center;}
@keyframes pct{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.fl{animation:fl 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
.fl2{animation-delay:1.2s}.fl3{animation-delay:2.4s}.fl4{animation-delay:3.1s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(12deg)}}
</style>
</defs>
