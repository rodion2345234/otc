<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 420" width="1170" height="420">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064A2A"/><stop offset=".55" stop-color="#0C7A41"/><stop offset="1" stop-color="#139A52"/></linearGradient>
<radialGradient id="glow" cx=".82" cy=".5" r=".45"><stop offset="0" stop-color="#CFEAD8" stop-opacity=".5"/><stop offset="1" stop-color="#CFEAD8" stop-opacity="0"/></radialGradient>
<linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6B0"/><stop offset=".35" stop-color="#FFE14D"/><stop offset=".75" stop-color="#FFC21A"/><stop offset="1" stop-color="#F29A00"/></linearGradient>
<linearGradient id="starEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBD9"/><stop offset="1" stop-color="#E08A00"/></linearGradient>
<linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84A"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064A22" flood-opacity=".45"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
<path id="s5" d="M0,-1 L.2245,-.309 L.9511,-.309 L.3633,.118 L.5878,.809 L0,.382 L-.5878,.809 L-.3633,.118 L-.9511,-.309 L-.2245,-.309Z"/>
<path id="s4" d="M0,-1 Q.12,-.12 1,0 Q.12,.12 0,1 Q-.12,.12 -1,0 Q-.12,-.12 0,-1Z"/>
<style>
.tw{animation:tw 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
.tw2{animation-delay:.8s}.tw3{animation-delay:1.6s}.tw4{animation-delay:.4s}
@keyframes tw{0%,100%{opacity:.35; transform:scale(.6) rotate(0)}50%{opacity:1; transform:scale(1.15) rotate(45deg)}}
.big{animation:big 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes big{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.04)}}
.flare{animation:flare 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes flare{0%,100%{opacity:.6; transform:scale(.8) rotate(0)}50%{opacity:1; transform:scale(1.25) rotate(90deg)}}
.pill{animation:pill 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes pill{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fl{animation:fl 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
.fl2{animation-delay:1.2s}.fl3{animation-delay:2.4s}.fl4{animation-delay:3.1s}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(12deg)}}
.pct{animation:pct 3s ease-in-out infinite; transform-box:fill-box; transform-origin:left center;}
@keyframes pct{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style>
</defs>
<rect width="1170" height="420" fill="url(#bg)"/>
<rect width="1170" height="420" fill="url(#glow)"/>
<path d="M-50 330 Q 400 180 1220 300" stroke="#fff" stroke-opacity=".12" stroke-width="3" fill="none"/>
<path d="M300 -20 Q 700 160 1200 60" stroke="#fff" stroke-opacity=".10" stroke-width="2" fill="none"/>
<g fill="#7FE0A6" fill-opacity=".55">
<g class="fl fl1"><use href="#s5" transform="translate(520 80) scale(46) rotate(-12)"/></g>
<g class="fl fl2"><use href="#s5" transform="translate(860 360) scale(40) rotate(10)"/></g>
<g class="fl fl3"><use href="#s5" transform="translate(150 380) scale(34) rotate(-20)"/></g>
<g class="fl fl4"><use href="#s5" transform="translate(1110 40) scale(30) rotate(18)"/></g>
</g>
<g fill="#CFF5DD" fill-opacity=".85">
<g class="tw tw1"><use href="#s4" transform="translate(640 210) scale(16)"/></g>
<g class="tw tw2"><use href="#s4" transform="translate(760 80) scale(10)"/></g>
<g class="tw tw3"><use href="#s4" transform="translate(470 330) scale(9)"/></g>
<g class="tw tw4"><use href="#s4" transform="translate(600 380) scale(7)"/></g>
</g>
<text x="58" y="78" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#fff" letter-spacing="1">Lolz<tspan fill="#FFD84A">Market</tspan></text>
<text class="pct" x="52" y="230" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="150" fill="#fff" letter-spacing="-4">20%</text>
<text x="58" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="56" fill="#fff">Реферальная</text>
<text x="58" y="362" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="56" fill="#fff">программа</text>
<g class="pill"><g filter="url(#sh)">
<rect x="610" y="112" width="365" height="70" rx="35" fill="url(#pill)"/>
</g>
<use href="#s5" transform="translate(655 147) scale(18)" fill="#fff"/>
<text x="685" y="157" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#fff">Приглашай друзей</text></g>
<g transform="translate(1065 290) rotate(-14)"><g class="big" filter="url(#sh)">
<use href="#s5" transform="scale(250)" fill="url(#starEdge)" stroke="#FFE680" stroke-width=".02" stroke-linejoin="round"/>
<use href="#s5" transform="scale(228)" fill="url(#star)"/>
<path d="M0,-228 L51,-70 L-30,-20Z" fill="#FFFBE0" fill-opacity=".55"/>
<path d="M-217,-70 L-83,-70 L-60,10Z" fill="#FFFBE0" fill-opacity=".35"/>
</g></g>
<g class="flare"><g fill="#fff" filter="url(#soft)" opacity=".9"><use href="#s4" transform="translate(1010 175) scale(42)"/></g>
<use href="#s4" transform="translate(1010 175) scale(34)" fill="#fff"/>
<circle cx="1010" cy="175" r="16" fill="#fff"/></g>
</svg>
