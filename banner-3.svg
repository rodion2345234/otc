<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 420" width="1170" height="420">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3FBF6"/><stop offset="1" stop-color="#DCF3E6"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0E5A32" flood-opacity=".22"/></filter>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D36B"/><stop offset="1" stop-color="#15A34A"/></linearGradient>
<linearGradient id="y" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE36B"/><stop offset="1" stop-color="#FFAA00"/></linearGradient>
<linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A8BFF"/><stop offset="1" stop-color="#6C56E8"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DE0FF"/><stop offset="1" stop-color="#0098EA"/></linearGradient>
<style>
.ic{animation:bob 4s ease-in-out infinite;}
.ic:nth-child(2){animation-delay:.6s}.ic:nth-child(3){animation-delay:1.2s}.ic:nth-child(4){animation-delay:1.8s}.ic:nth-child(5){animation-delay:2.4s}.ic:nth-child(6){animation-delay:3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ttl{animation:ttl 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
@keyframes ttl{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
</style>
</defs>
<rect width="1170" height="420" fill="url(#bg)"/>
<g filter="url(#sh)">
